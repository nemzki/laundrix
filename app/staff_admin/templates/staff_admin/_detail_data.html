{% set view=namespace(activity=[]) %}
{% for event,actor_email in activity %}{% set view.activity=view.activity+[dict(label=event.event|replace('_',' ')|capitalize,time=event.created_at|localdt,actor=actor_email or '',detail=event.detail or '',success=event.success)] %}{% endfor %}
<script type="application/json" id="laundrix-staff-detail">{{ dict(id=staff.id,name=staff.full_name or 'Unnamed',email=staff.email,status=staff.account_status,label=statuses.LABELS[staff.account_status],identity=idv_label,identityDecision=(verification.decided_at|localdt if verification and verification.decided_at else ''),created=staff.created_at|localdt,lastLogin=(staff.last_login_at|localdt if staff.last_login_at else 'Never'),approved=(staff.approved_at|localdt if staff.approved_at else 'Not yet'),approver=(approver.full_name or approver.email if approver else ''),changed=(staff.status_changed_at|localdt if staff.status_changed_at else 'Not recorded'),changedBy=(changed_by.full_name or changed_by.email if changed_by else ''),reason=staff.status_reason or '',enrollment=('Active until ' ~ (link_expires|localdt) if link_live else 'None active'),activity=view.activity)|tojson }}</script>
